# SmallPE Pandoc Defaults
#
# Usage:
#   sed 's/→/-->/g' report.md | pandoc --defaults=templates/pandoc-defaults.yml -o report.pdf
#
# Override header text per-report — put the override in a FILE and pass it with -H:
#   printf '%s\n' '\fancyhead[L]{\textcolor{smallpegray}{\small\sffamily Due Diligence}}' > /tmp/hdr.tex
#   pandoc --defaults=templates/pandoc-defaults.yml -H /tmp/hdr.tex -o report.pdf
#
# Do NOT use `-V header-includes='\fancyhead...'` for this. Pandoc emits the
# header-includes VARIABLE before the include-in-header FILES, so the override lands
# ahead of smallpe-report.latex's \usepackage{fancyhdr} and the build dies with
#   ! Undefined control sequence.  \fancyhead
# A -H file is appended after the defaults' includes, so fancyhdr is already loaded.
#
# All paths are relative to the agentic-team-for-private-equity/ directory.

from: markdown
pdf-engine: tectonic
include-in-header:
  - templates/smallpe-report.latex
  - templates/brand-fonts.tex

# --- Typography ---
# No `mainfont:` here on purpose. It used to say "Charter", a font fontspec looks for on
# the SYSTEM: present on macOS, absent on Debian, so every container build failed with
#   ! Package fontspec Error: The font "Charter" cannot be found.
# All three faces now come from templates/brand-fonts.tex, generated by
# dsh/scripts/install-tools.sh from the TTFs this repository ships, so the PDF is
# identical on a laptop and in the container.
variables:
  fontsize: "10pt"
  linestretch: 1.25
  geometry:
    - margin=1in
  classoption:
    - twoside
  colorlinks: true
  linkcolor: "[HTML]{1a1a2e}"
  urlcolor: "[HTML]{2563eb}"
  toccolor: "[HTML]{1a1a2e}"

# --- Table of Contents ---
table-of-contents: true
toc-depth: 2

# --- Standalone document ---
standalone: true
