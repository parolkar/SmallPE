# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).
#
# SmallPE localisation. A config override replaces the row's whole config, so
# every value a row needs is restated here.

# ---------------------------------------------------------------------------
# One entry point for the whole team
# ---------------------------------------------------------------------------
# The DS Bot team workspace is the SmallPE team folder inside this repo. The
# absolute path is computed at run time because the repo can be cloned to any
# directory: bin/run.sh exports SMALLPE_TEAM_WORKSPACE, and when it is unset we
# derive the folder from DSH_HOME ($ROOT/dsh/home -> $ROOT/agentic-team-for-
# private-equity). The `bot` row carries no other config in the bundles, and
# its remaining fields keep their built-in defaults.
- id: bot
  name: ds-bot
  config:
    workspace: !!js "process.env.SMALLPE_TEAM_WORKSPACE || process.getBuiltinModule('node:path').resolve(process.env.DSH_HOME || '.', '..', '..', 'agentic-team-for-private-equity')"

# ---------------------------------------------------------------------------
# Two model providers, and no vendor sign-in
# ---------------------------------------------------------------------------
# The harness ships pointing at DeepSeek's own account/API-key providers, and
# the account feature greets a fresh install with a "Get started / Sign in to
# your DeepSeek account" modal before anything can be done. This install is
# provider-neutral and local-first, so:
#   * the DeepSeek account, its API-key provider and that modal are disabled
#     (below), and
#   * exactly two providers are configured here instead — a local
#     OpenAI-compatible server, and OpenRouter.
- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek-api-key'
  disabled: true

- id: llm-deepseek-account
  name: '@deepseek-ai/dsh-llm-deepseek-account'
  disabled: true

# The account settings surface owns the sign-in modal. Disabling it removes the
# modal with it; there is no account to manage on a local-only install.
- id: ui-settings-account
  name: '@deepseek-ai/dsh-client-ui-settings-account'
  disabled: true

- id: llm-pi-ai
  name: '@deepseek-ai/dsh-llm-pi-ai'
  config:
    providers:
      # A model server running on this machine (LM Studio, Ollama's
      # OpenAI-compatible endpoint, llama.cpp, vLLM, MLX, …). Point it anywhere
      # without editing this file:
      #   SMALLPE_LOCAL_BASE_URL=http://127.0.0.1:11434/v1 ./bin/run.sh
      # The API key is a placeholder: bin/run.sh defaults SMALLPE_LOCAL_API_KEY
      # to "local" because OpenAI-compatible clients insist on sending one.
      local:
        displayName: Local
        apiKeyEnv: SMALLPE_LOCAL_API_KEY
        api: openai-completions
        baseURL: !!js "process.env.SMALLPE_LOCAL_BASE_URL || 'http://127.0.0.1:1234/v1'"
        # A hand-declared route is not in DSH's model catalog, so its models must
        # be listed here — an empty list is a configuration error, not a blank
        # slate. One placeholder is declared; replace the id with whatever your
        # server serves, either in Settings -> Models or by exporting
        #   SMALLPE_LOCAL_MODEL=your-model-id ./bin/run.sh
        models: !!js "[{ id: process.env.SMALLPE_LOCAL_MODEL || 'local-model', name: 'Local model', contextWindow: 32768, maxTokens: 8192, input: ['text'], reasoningEfforts: false }]"
      # OpenRouter: one API key, many models. Set OPENROUTER_API_KEY, or add the
      # key in Settings -> Models.
      openrouter:
        displayName: OpenRouter
        apiKeyEnv: OPENROUTER_API_KEY
        api: openai-completions
        baseURL: https://openrouter.ai/api/v1
        models:
          - id: deepseek/deepseek-chat
            name: DeepSeek Chat
            contextWindow: 163840
            maxTokens: 16000
            input: [text]
            reasoningEfforts: false
          - id: anthropic/claude-sonnet-4.6
            name: Claude Sonnet 4.6
            contextWindow: 1000000
            maxTokens: 128000
            input: [text, image]
            reasoningEfforts:
              off: null
              low: low
              medium: medium
              high: high
          - id: openai/gpt-5
            name: GPT-5
            contextWindow: 400000
            maxTokens: 128000
            input: [text, image]
            reasoningEfforts:
              off: null
              low: low
              medium: medium
              high: high
          - id: google/gemini-2.5-pro
            name: Gemini 2.5 Pro
            contextWindow: 1048576
            maxTokens: 65536
            input: [text, image]
            reasoningEfforts:
              off: null
              low: low
              medium: medium
              high: high
          - id: meta-llama/llama-3.3-70b-instruct
            name: Llama 3.3 70B Instruct
            contextWindow: 131072
            maxTokens: 16384
            input: [text]
            reasoningEfforts: false

# The shipped default names the DeepSeek account provider we just disabled, so
# it has to be repointed or the team starts with a model that does not exist.
# Change it in the UI, or here, once you have a provider working.
- id: agent-default-model
  name: '@deepseek-ai/dsh-agent-default-model'
  config:
    provider: openrouter
    model: deepseek/deepseek-chat

# ---------------------------------------------------------------------------
# SmallPE look and language
# ---------------------------------------------------------------------------
# NOTE: the `plugin-manager` row is deliberately left untouched. Its config
# schema requires `registry` with no default, and a config override replaces the
# row's whole config, so a partial override would fail validation. pnpm is found
# through PATH instead: bin/install.sh and bin/run.sh prepend
# $ROOT/dsh/node_modules/.bin, which covers both the `dsh plugin` CLI (bare
# `pnpm` from PATH) and the in-process installer (`pnpmCommand` defaults to
# "pnpm", also resolved from PATH).

- id: ui-theme
  name: "@deepseek-ai/dsh-client-ui-theme"
  config:
    preference: system

# The official DeepSeek brand mark stays off so the SmallPE sidebar brand wins.
- id: ui-brand-official
  name: '@deepseek-ai/dsh-client-ui-brand-official'
  disabled: true

- id: locale
  name: "@deepseek-ai/dsh-client-locale"
  config:
    preference: en

# Pre-acknowledge the harness "Preview Notice" so a first run opens straight into
# the team instead of a modal. The notice compares the stored acknowledgement
# with the shipped notice version for exact equality, so recording the current
# version here is the supported way to treat it as already read. If a future DSH
# release changes the notice materially it bumps this value and the notice
# returns — delete this entry (or press Continue) if you would rather see it.
- id: ui-settings-general
  name: "@deepseek-ai/dsh-client-ui-settings-general"
  config:
    welcomeNoticeVersion: "2026-09-28.1"
