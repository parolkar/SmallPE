# SmallPE — DeepSeek Harness credentials store (TEMPLATE)
#
# This file is copied to $DSH_HOME/.credentials.yaml by install.sh on first run.
# It starts intentionally EMPTY: no API keys, no accounts, no identity records are
# shipped with this repository.
#
# How to add your own key:
#   Preferred — open the Web UI, go to Settings -> Models, and add your provider and key
#   there. The UI writes the credential record below for you.
#
#   Manual — set the environment variable named by your provider's `apiKeyEnv`
#   (e.g. export SMALLPE_API_KEY=...) before running ./bin/run.sh. The resolver checks, in
#   order: this file's `refs`, then the launch environment, then ./.env, then
#   $DSH_HOME/.env. Never commit a real key.
#
# `records` holds non-key account state (web-UI logins, ownership, KDF parameters).
# Leaving it empty is correct and safe: anything that needs a record recreates it.
version: 1
refs: {}
records: {}
