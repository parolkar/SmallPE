<!-- Shared mailing-list signup band. Rendered site-wide from default.html,
     positioned directly above the footer so it behaves as a persistent
     footer element on every page. -->
<section id="newsletter" class="bg-gray-900 py-14">
  <div class="container mx-auto px-4 text-center">
    <h3 class="text-2xl md:text-3xl font-bold text-white mb-3" data-aos="fade-up">Stay in the loop</h3>
    <p class="text-gray-300 max-w-xl mx-auto mb-6" data-aos="fade-up" data-aos-delay="100">
      Join our mailing list to stay updated on our progress and opportunities to contribute.
    </p>
    <div class="flex justify-center" data-aos="fade-up" data-aos-delay="200">
      <iframe
        src="https://abhishek.parolkar.com/embed?minimal=true"
        style="width:480px; max-width:100%; height:45px; border:1px solid #EEE; background:#ffffff;"
        frameborder="0" scrolling="no" loading="lazy"
        title="SmallPE mailing list signup">
      </iframe>
    </div>
  </div>
</section>
